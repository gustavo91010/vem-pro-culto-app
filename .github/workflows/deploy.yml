name: Build and Deploy Next.js


on:
  push:
    tags:
      - 'v*'  # dispara para qualquer tag v1.0.0, v2.3.1, etc

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para ver as tags

      - name: Get version from Git tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Versão da tag: $TAG"

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_AUTH_URL=${{ secrets.NEXT_PUBLIC_AUTH_URL }}" >> .env
          echo "VPC_API_URL=${{ secrets.VPC_API_URL }}" >> .env
          echo "AUTH_API_URL=${{ secrets.AUTH_API_URL }}" >> .env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vem-pro-culto-app:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vem-pro-culto-app:latest
          build-args: |
            NEXT_PUBLIC_AUTH_URL=${{ secrets.NEXT_PUBLIC_AUTH_URL }}
            VPC_API_URL=${{ secrets.VPC_API_URL }}
            AUTH_API_URL=${{ secrets.AUTH_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
